
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serik AI — WebLLM + DuckDuckGo</title>
    <link rel="icon" type="image/jpeg" href="Screenshot_20260804_225910_Gallery.jpg">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.52/lib/index.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --bg: #131314; --surface: #1e1f20; --hover: #333538;
            --text: #e3e3e3; --text2: #c4c7c5; --bubble: #303134;
            --accent: #a8c7fa;
        }
        * { box-sizing:border-box;margin:0;padding:0; }
        body { background: var(--bg); color: var(--text); font-family: 'Google Sans', Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--surface); display: flex; flex-direction: column; transition: transform 0.3s; z-index: 100; height: 100%; }
        .sidebar-header { padding: 12px 16px; }
        .btn { background: transparent; border: none; color: var(--text); padding: 12px 16px; border-radius: 50px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; transition: background 0.2s; }
        .btn:hover { background: var(--hover); }
        .chat-history { flex:1; overflow-y: auto; padding: 8px; }
        .history-item { padding: 10px 12px; border-radius: 50px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
        .history-item:hover { background: var(--hover); }
        .delete-btn { background: none; border: none; color: var(--text2); cursor: pointer; }
        .lang-select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid #444; padding: 8px; border-radius: 20px; margin: 8px 0; }
        .main { flex:1; display: flex; flex-direction: column; position: relative; }
        .top-bar { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .welcome { flex:1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .gradient-text { font-size: 36px; font-weight: 500; background: linear-gradient(74deg, #4285f4, #9b72cb, #d96570, #9b72cb, #4285f4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: move 8s ease infinite; background-size: 400% 100%; }
        @keyframes move { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .chat-container { display:none; flex:1; overflow-y: auto; padding: 20px 20px 120px; }
        .msg-wrap { max-width: 800px; margin: 0 auto 20px auto; display: flex; gap: 12px; }
        .msg-wrap.user { justify-content: flex-end; }
        .msg-wrap.ai { justify-content: flex-start; }
        .msg { font-size: 16px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
        .msg-wrap.user .msg { background: var(--bubble); padding: 12px 18px; border-radius: 24px 24px 4px 24px; max-width: 85%; }
        .msg-wrap.ai .msg { padding: 4px 0; max-width: 100%; }
        .ai-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
        .ai-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .actions { display: flex; gap: 4px; margin-top: 6px; opacity: 0.7; }
        .actions button { background: none; border: none; color: var(--text2); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        .actions button:hover { background: rgba(255,255,255,0.1); color: white; }
        .input-area { position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px 16px 20px; background: linear-gradient(to top, var(--bg) 75%, transparent); }
        .input-box { background: var(--surface); border-radius: 32px; display: flex; align-items: flex-end; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.05); }
        .input-box:focus-within { background: #2b2c2e; }
        .input-box textarea { flex:1; background: transparent; border: none; color: var(--text); font-size: 16px; resize: none; max-height: 120px; padding: 8px; outline: none; font-family: inherit; }
        .input-box button { background: transparent; border: none; color: var(--text2); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
        .input-box button:hover { background: rgba(255,255,255,0.1); color: white; }
        .loading-logo { animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%{transform:scale(0.9);opacity:0.6} 50%{transform:scale(1.1);opacity:1} 100%{transform:scale(0.9);opacity:0.6} }
        #adminPanel { display:none; position: absolute; bottom: 120px; left: 20px; background: var(--surface); padding: 20px; border-radius: 16px; width: 280px; z-index: 200; }
        #adminPanel input, #adminPanel textarea { width: 100%; background: var(--bg); border: 1px solid #444; color: white; padding: 8px; border-radius: 8px; margin-bottom: 8px; }
        #adminPanel button { background: var(--accent); color: black; width: 100%; border: none; padding: 10px; border-radius: 20px; font-weight: bold; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -280px; height: 100%; }
            .sidebar.open { left: 0; }
            .gradient-text { font-size: 28px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="btn" onclick="toggleSidebar()"><span class="material-symbols-outlined">menu</span></button>
        </div>
        <button class="btn" onclick="newChat()"><span class="material-symbols-outlined">add</span><span data-i18n="new_chat">Новый чат</span></button>
        <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="kk">🇰🇿 Қазақша</option><option value="ru" selected>🇷🇺 Русский</option><option value="en">🇬🇧 English</option><option value="ky">🇰🇬 Кыргызча</option><option value="tr">🇹🇷 Türkçe</option><option value="uz">🇺🇿 O'zbekcha</option>
        </select>
        <div class="chat-history" id="chatHistoryList"></div>
        <div style="padding: 16px;">
            <button class="btn" id="voiceBtn" onclick="toggleVoice()"><span class="material-symbols-outlined">volume_off</span><span data-i18n="voice_off">Голос выкл</span></button>
            <button class="btn" onclick="toggleAdmin()"><span class="material-symbols-outlined">settings</span><span data-i18n="settings">Настройки</span></button>
        </div>
    </aside>
    <div id="adminPanel">
        <h4>🔒 Скрытая база</h4>
        <input type="password" id="adminPass" placeholder="Пароль" oninput="checkAdmin()">
        <div id="adminTools" style="display:none">
            <textarea id="bulkData" placeholder="вопрос это ответ"></textarea>
            <button onclick="bulkLearn()">Сохранить</button>
        </div>
    </div>
    <div class="main">
        <div class="top-bar">
            <button class="btn" onclick="toggleSidebar()" style="display:none;" class="mobile-only"><span class="material-symbols-outlined">menu</span></button>
            <div style="display:flex;align-items:center;gap:10px;"><img src="Screenshot_20260804_225910_Gallery.jpg" style="width:32px;height:32px;border-radius:8px;"><span style="font-size:18px;font-weight:500;">Serik AI</span></div>
            <div style="width:32px;height:32px;background:#604085;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;">N</div>
        </div>
        <div class="welcome" id="welcomeScreen">
            <div class="gradient-text" data-i18n="greeting">Привет, Nurik</div>
            <p style="color:#888;margin:20px 0;" data-i18n="sub_greeting">Я работаю на WebLLM + DuckDuckGo</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
                <button class="btn" onclick="ask('Киберпанк стилінде көлік нарисуй')">🚗 Авто будущего</button>
                <button class="btn" onclick="ask('C++ тілінде hello world')">💻 Hello World</button>
            </div>
        </div>
        <div class="chat-container" id="chatBox"></div>
        <div class="input-area">
            <div class="input-box">
                <button onclick="alert('Скоро')"><span class="material-symbols-outlined">add_photo_alternate</span></button>
                <button id="micBtn" onclick="toggleVoice()"><span class="material-symbols-outlined">mic</span></button>
                <textarea id="userInput" placeholder="Сұрақ жазыңыз..." oninput="this.style.height='44px';this.style.height=this.scrollHeight+'px';" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
                <button id="stopBtn" onclick="stopGeneration()" style="display:none;"><span class="material-symbols-outlined">stop</span></button>
                <button id="sendBtn" onclick="send()"><span class="material-symbols-outlined">send</span></button>
            </div>
            <div style="text-align:center;font-size:11px;color:#888;margin-top:6px;">WebLLM + DuckDuckGo</div>
        </div>
    </div>

    <script>
        // ==================== ТІЛДЕР ====================
        const i18n = {
            kk:{new_chat:"Жаңа чат",voice_off:"Дауыс өшірулі",voice_on:"Дауыс қосулы",settings:"Баптаулар",greeting:"Сәлем, Nurik",sub_greeting:"WebLLM + DuckDuckGo қосылды",placeholder:"Сұрақ жазыңыз...",download:"Жүктеу",stop:"Тоқтату"},
            ru:{new_chat:"Новый чат",voice_off:"Голос выкл",voice_on:"Голос вкл",settings:"Настройки",greeting:"Привет, Nurik",sub_greeting:"WebLLM + DuckDuckGo активны",placeholder:"Напишите запрос...",download:"Скачать",stop:"Стоп"},
            en:{new_chat:"New Chat",voice_off:"Voice Off",voice_on:"Voice On",settings:"Settings",greeting:"Hello, Nurik",sub_greeting:"WebLLM + DuckDuckGo active",placeholder:"Ask something...",download:"Download",stop:"Stop"},
            ky:{new_chat:"Жаңы чат",voice_off:"Үн өчүрүлдү",voice_on:"Үн күйгүзүлдү",settings:"Орнотуулар",greeting:"Салам, Nurik",sub_greeting:"WebLLM + DuckDuckGo иштейт",placeholder:"Суроо жазыңыз...",download:"Жүктөө",stop:"Токтотуу"},
            tr:{new_chat:"Yeni Sohbet",voice_off:"Ses Kapalı",voice_on:"Ses Açık",settings:"Ayarlar",greeting:"Merhaba, Nurik",sub_greeting:"WebLLM + DuckDuckGo aktif",placeholder:"Bir şey sor...",download:"İndir",stop:"Dur"},
            uz:{new_chat:"Yangi chat",voice_off:"Ovoz o'chirilgan",voice_on:"Ovoz yoqilgan",settings:"Sozlamalar",greeting:"Salom, Nurik",sub_greeting:"WebLLM + DuckDuckGo ishlamoqda",placeholder:"So'rov yozing...",download:"Yuklab olish",stop:"To'xtatish"}
        };
        let lang = 'ru';
        function t(key){ return i18n[lang]?.[key] || i18n['ru'][key] || key; }
        function changeLanguage(l){ lang=l; document.querySelectorAll('[data-i18n]').forEach(e=>{ let k=e.dataset.i18n; if(i18n[lang]?.[k]) e.innerText = i18n[lang][k]; }); document.getElementById('userInput').placeholder = t('placeholder'); }

        // ==================== FIREBASE ====================
        const firebaseConfig = { apiKey:"AIzaSyAzofVJLZNadLA1-1XsCSqCukJ4gkPzqoo", authDomain:"serik-ai.firebaseapp.com", databaseURL:"https://serik-ai-default-rtdb.firebaseio.com", projectId:"serik-ai", storageBucket:"serik-ai.appspot.com" };
        let db = null;
        if(firebaseConfig.apiKey){ firebase.initializeApp(firebaseConfig); db = firebase.database(); }
        let memory = { "привет":"Привет! Я Serik AI 👋", "сәлем":"Сәлем! 👋" };
        if(db) db.ref('serik_memory').on('value', snap => { if(snap.val()) Object.assign(memory, snap.val()); });

        // ==================== WEBLLM ====================
        let engine = null, webllmReady = false;
        async function loadWebLLM() {
            try {
                addMessage("⚡ WebLLM жүктелуде...", 'ai', true);
                engine = await webllm.CreateMLCEngine("TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC", {
                    initProgressCallback: (p) => {
                        const el = document.getElementById('loading-msg');
                        if(el) el.querySelector('.msg').innerText = `⚡ WebLLM ${(p.progress*100).toFixed(0)}%`;
                    }
                });
                webllmReady = true;
                addMessage("✅ WebLLM дайын! Енді жергілікті нейрожелі жұмыс істейді.", 'ai', true);
            } catch(e) {
                console.warn("WebLLM жүктелмеді:", e);
                webllmReady = false;
                addMessage("⚠️ WebLLM қолданылмады. DuckDuckGo іздеуімен жұмыс істеймін.", 'ai', true);
            }
        }

        // ==================== DUCKDUCKGO ====================
        async function searchDuckDuckGo(query) {
            const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
            try {
                const r = await fetch(url);
                const j = await r.json();
                let text = j.AbstractText || j.RelatedTopics?.[0]?.Text || '';
                return text.trim() || null;
            } catch(e) { return null; }
        }

        // ==================== UI ====================
        const chatBox = document.getElementById('chatBox'), welcome = document.getElementById('welcomeScreen');
        let voice = false, abort = null, loading = null, isFirst = true, lastUser = '', sessions = JSON.parse(localStorage.getItem('serik_chats')||'[]'), currentSes = null;

        function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }
        function newChat(){ chatBox.innerHTML=''; chatBox.style.display='none'; welcome.style.display='flex'; isFirst=true; if(abort){abort.abort();abort=null;} hideLoading(); toggleSendStop(false); }
        function ask(txt){ document.getElementById('userInput').value = txt; send(); }
        function toggleAdmin(){ document.getElementById('adminPanel').style.display = document.getElementById('adminPanel').style.display==='block'?'none':'block'; }
        function toggleSendStop(show){ document.getElementById('sendBtn').style.display=show?'none':'flex'; document.getElementById('stopBtn').style.display=show?'flex':'none'; }
        function stopGeneration(){ if(abort){abort.abort();abort=null; hideLoading(); toggleSendStop(false);} }

        function addMessage(text, sender, isHTML=false){
            if(isFirst){ welcome.style.display='none'; chatBox.style.display='block'; isFirst=false; }
            const w = document.createElement('div'); w.className = `msg-wrap ${sender}`;
            if(sender==='ai'){
                w.innerHTML = `<div class="ai-avatar"><img src="Screenshot_20260804_225910_Gallery.jpg"></div><div class="msg">${text}</div><div class="actions"><button onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.innerText)">📋</button></div>`;
            } else {
                w.innerHTML = `<div class="msg">${text}</div>`;
            }
            chatBox.appendChild(w); chatBox.scrollTop = chatBox.scrollHeight;
            if(sender==='ai' && voice) speak(text);
            // save session
            if(currentSes){
                let ses = sessions.find(s=>s.id===currentSes);
                if(ses) { ses.messages.push({text,sender}); localStorage.setItem('serik_chats',JSON.stringify(sessions)); }
            }
            return w;
        }

        function hideLoading(){ if(loading?.parentNode) loading.parentNode.removeChild(loading); loading=null; }

        async function send(){
            const inp = document.getElementById('userInput');
            const text = inp.value.trim(); if(!text) return;
            lastUser = text; addMessage(text, 'user'); inp.value=''; inp.style.height='44px';

            // жаңа сессия
            if(!currentSes){ currentSes = Date.now().toString(); sessions.unshift({id:currentSes, title:text.slice(0,30), messages:[]}); localStorage.setItem('serik_chats',JSON.stringify(sessions)); }

            if(/^[\d\s+\-*/().]+$/.test(text)){ showLoading(); setTimeout(()=>{ hideLoading(); addMessage(`🧮 ${eval(text)}`, 'ai'); },500); return; }
            if(memory[text.toLowerCase()]){ showLoading(); setTimeout(()=>{ hideLoading(); addMessage(memory[text.toLowerCase()], 'ai'); },300); return; }

            // Сурет
            if(/нарисуй|сурет сал|draw|generate image/i.test(text)){
                showLoading();
                const prompt = text.replace(/нарисуй|сурет сал|draw|generate image/gi,'').trim();
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt+', masterpiece, high resolution')}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random()*1e6)}`;
                setTimeout(()=>{ hideLoading(); addMessage(`<img src="${url}" style="max-width:100%;border-radius:12px;"><br><a href="${url}" download>${t('download')}</a>`, 'ai', true); },1500);
                return;
            }

            showLoading(); toggleSendStop(true);
            abort = new AbortController();
            try {
                let reply = '';
                if(webllmReady && engine){
                    const msg = await engine.chat.completions.create({
                        messages:[{role:"system",content:"Sen Serik AI. Қысқа жауап бер."},{role:"user",content:text}],
                        temperature:0.7, max_tokens:200, signal:abort.signal
                    });
                    reply = msg.choices[0].message.content;
                } else {
                    const ddg = await searchDuckDuckGo(text);
                    reply = ddg || "Дерек табылмады. Басқа сұрақ қойыңыз.";
                }
                hideLoading(); toggleSendStop(false);
                addMessage(reply, 'ai');
            } catch(e){
                hideLoading(); toggleSendStop(false);
                if(e.name!=='AbortError') addMessage("⚠️ Қате. Қайталаңыз.", 'ai');
            } finally { abort=null; }
        }

        function showLoading(){
            if(loading) return;
            if(isFirst){ welcome.style.display='none'; chatBox.style.display='block'; }
            loading = document.createElement('div'); loading.className='msg-wrap ai'; loading.id='loading-msg';
            loading.innerHTML = `<div class="ai-avatar loading-logo"><img src="Screenshot_20260804_225910_Gallery.jpg"></div><div class="msg">Ойлануда...</div>`;
            chatBox.appendChild(loading); chatBox.scrollTop = chatBox.scrollHeight;
        }

        function toggleVoice(){ voice=!voice; document.getElementById('voiceBtn').innerHTML = `<span class="material-symbols-outlined">${voice?'volume_up':'volume_off'}</span><span>${t(voice?'voice_on':'voice_off')}</span>`; if(!voice) speechSynthesis.cancel(); }
        function speak(txt){ if(!voice) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt.replace(/[📋✅🔥]/g,'')); u.lang = /[әғқңөұүһіІ]/g.test(txt)?'kk-KZ':'ru-RU'; u.rate=1.1; speechSynthesis.speak(u); }
        function checkAdmin(){ document.getElementById('adminTools').style.display = document.getElementById('adminPass').value==='nurik777'?'block':'none'; }
        function bulkLearn(){ /* ... */ }

        // инициализация
        loadWebLLM();
        changeLanguage(lang);
    </script>
</body>
</html>
