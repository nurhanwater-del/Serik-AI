<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serik AI Pro</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #0f0f14; color: white; display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 260px; background: #1a1a24; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0f0f14; }
.chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
.msg { padding: 12px; margin: 6px 0; border-radius: 10px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
.user { background: #00b86b; margin-left: auto; color: white; }
.ai { background: #2b2b3a; margin-right: auto; }
.row { display: flex; border-top: 1px solid #222; background: #111; padding: 10px; gap: 10px; }
input, textarea { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 6px; outline: none; background: #16161a; color: white; font-size: 16px; }
input:focus, textarea:focus { border-color: #00b86b; }
button { padding: 12px; background: #00b86b; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: bold; font-size: 16px; }
button:hover { background: #009e5b; }
#voiceBtn { background: #444; margin-bottom: 10px; }
#voiceBtn.active { background: #007bff; }
#adminPanel { display: none; margin-top: 10px; background: #222230; padding: 10px; border-radius: 8px; }
textarea { height: 120px; resize: none; }
@media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; max-height: 220px; border-bottom: 1px solid #2b2b3a; padding: 10px; }
    .main { flex: 1; height: calc(100vh - 220px); }
    .row { padding: 8px; }
    button { width: auto; padding: 12px 20px; }
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>🤖 Serik AI</h3>
    <button id="voiceBtn" onclick="toggleVoice()">🔇 Голос: ВЫКЛ</button>
    <input type="password" id="adminPass" placeholder="Пароль администратора" oninput="checkAdmin()">
    <div id="adminPanel">
        <p style="color: #00b86b; margin: 0 0 5px 0; font-weight: bold;">🔒 ADMIN MODE</p>
        <h4 style="margin: 5px 0;">🧠 База знаний</h4>
        <textarea id="bulk" placeholder="привет это привет куку"></textarea>
        <button onclick="bulkLearn()">Сохранить базу</button>
    </div>
</div>

<div class="main">
    <div class="chat" id="chat"></div>
    <div class="row">
        <input id="input" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') send()">
        <button onclick="send()">Отправить</button>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzofVJLZNadLA1-1XsCSqCukJ4gkPzqoo",
  authDomain: "serik-ai.firebaseapp.com",
  databaseURL: "https://serik-ai-default-rtdb.firebaseio.com",
  projectId: "serik-ai",
  storageBucket: "serik-ai.appspot.com"
};

const defaultMemory = {
    "привет": "Привет! Я готов помочь. Задавай любой вопрос! 👋",
    "что ты умеешь": "Я умный ИИ-ассистент. Я понимаю длинные и короткие вопросы, пишу эссе, рефераты и сам формулирую мысли на русском языке! 🧠",
    "как тебя зовут": "Я Serik-AI. 🤖"
};

let memory = Object.assign({}, defaultMemory);
let db = null;

if (firebaseConfig.apiKey) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    db.ref('serik_memory').on('value', (snapshot) => {
        const cloudData = snapshot.val();
        if (cloudData) { memory = Object.assign({}, defaultMemory, cloudData); }
    });
}

const chat = document.getElementById("chat");
let voiceEnabled = false;

function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    let btn = document.getElementById("voiceBtn");
    if (voiceEnabled) {
        btn.innerText = "🔊 Голос: ВКЛ";
        btn.classList.add("active");
    } else {
        btn.innerText = "🔇 Голос: ВЫКЛ";
        btn.classList.remove("active");
        window.speechSynthesis.cancel();
    }
}

function speakText(text) {
    if (!voiceEnabled) return;
    let cleanText = text.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '');
    cleanText = cleanText.replace(/[.,!?*]/g, ' ');
    let speech = new SpeechSynthesisUtterance(cleanText);
    speech.lang = 'ru-RU';
    window.speechSynthesis.speak(speech);
}

if(chat.children.length === 0) {
    setTimeout(() => {
        add("Привет! Я Serik AI. Я понимаю любые запросы — пиши кратко или задавай длинные, сложные вопросы. Я сам сформирую правильный ответ! 😉", "ai");
    }, 200);
}

function getLevenshteinDistance(a, b) {
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    let matrix = [];
    for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
    for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min( matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1 );
            }
        }
    }
    return matrix[b.length][a.length];
}

function add(text, type){
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    if (type === "ai" && text.length < 400 && text !== "💭 Анализирую...") speakText(text);
    return div; 
}

function checkAdmin(){
    let pass = document.getElementById("adminPass").value;
    document.getElementById("adminPanel").style.display = (pass === "nurik777") ? "block" : "none";
}

function bulkLearn(){
    let text = document.getElementById("bulk").value;
    let lines = text.split("\n");
    let count = 0;
    let newMemory = Object.assign({}, memory);

    for(let line of lines){
        line = line.trim();
        if(!line.includes(" это ")) continue;
        let parts = line.split(" это ");
        let q = parts[0].trim().toLowerCase();
        let a = parts.slice(1).join(" это ").trim();
        if(q && a){ newMemory[q] = a; count++; }
    }
    
    if (count > 0) {
        memory = newMemory;
        if (db) {
            db.ref('serik_memory').set(memory);
            alert("Успешно сохранено в облаке Firebase!");
        }
    }
    document.getElementById("bulk").value = "";
}

function brain(text){
    let userInput = text.toLowerCase().trim();
    if(memory[userInput]) return memory[userInput];

    let bestMatchKey = null;
    let minDistance = Infinity;

    for (let key of Object.keys(memory)) {
        let distance = getLevenshteinDistance(userInput, key);
        if (distance < minDistance) {
            minDistance = distance;
            bestMatchKey = key;
        }
    }

    if (bestMatchKey) {
        let maxAllowedErrors = Math.max(1, Math.floor(bestMatchKey.length * 0.25)); 
        if (minDistance <= maxAllowedErrors) { return memory[bestMatchKey]; }
    }
    return null;
}

// 1. ЗАПАСНОЙ ПЛАН (ВИКИПЕДИЯ), ЕСЛИ ИИ ЗАВИСНЕТ
async function searchWikipediaAsFallback(queryText) {
    try {
        let cleanQuery = queryText.replace(/(пожалуйста|расскажи про|что такое|кто такой|найди|реферат|эссе|кратко|подробно|толық|қысқа)/gi, "").trim();
        let searchUrl = `https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(cleanQuery)}&format=json&origin=*`;
        let res = await fetch(searchUrl);
        let data = await res.json();
        
        if (data.query.search.length > 0) {
            let title = data.query.search[0].title;
            let contentUrl = `https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=0&explaintext=1&titles=${encodeURIComponent(title)}&format=json&origin=*`;
            let contentRes = await fetch(contentUrl);
            let contentData = await contentRes.json();
            let pages = contentData.query.pages;
            let extract = pages[Object.keys(pages)[0]].extract;
            
            if (extract && extract.trim().length > 30) {
                // Если просят коротко
                if(queryText.toLowerCase().includes("кратко") || queryText.toLowerCase().includes("коротко")) {
                    return `🤖 [Кратко из базы данных]: ${extract.split(/(?<=[.!?])\s+/).slice(0, 2).join(" ")}`;
                }
                // Полный текст
                return `🤖 [Найдено в базе данных]:\n\n${extract.substring(0, 2000)}`;
            }
        }
        return null;
    } catch(e) {
        return null;
    }
}

// 2. ОСНОВНОЙ ПЛАН (ГЕНЕРАЦИЯ ИИ) С ЗАЩИТОЙ ОТ ОШИБОК
async function askSmartAI(queryText) {
    try {
        let systemPrompt = "Ты всезнающий ИИ Serik-AI. Отвечай всегда на русском языке. Пиши подробно или кратко в зависимости от просьбы пользователя. Если не знаешь, так и скажи.";
        let url = `https://text.pollinations.ai/${encodeURIComponent(queryText)}?system=${encodeURIComponent(systemPrompt)}`;
        
        let res = await fetch(url);
        let text = await res.text();
        
        // НОВАЯ ПРОВЕРКА: Если сервер выдал системную ошибку на английском
        if (text.includes('"error"') || text.includes('Queue full') || text.includes('status":429') || text.includes('pollinations.ai/')) {
            throw new Error("Сервер ИИ перегружен"); 
        }

        // Проверка: если текст нормальный
        if(text && text.length > 5 && !text.toLowerCase().includes("not found")) {
            return text.trim();
        }
    } catch (e) {
        console.log("AI Server blocked the request. Switching to Backup Plan...");
    }

    // ЕСЛИ ИИ НЕ СПРАВИЛСЯ ИЛИ ВЫДАЛ ОШИБКУ - АВТОМАТИЧЕСКИ ВРУБАЕМ ЗАПАСНОЙ ПЛАН
    let backupAnswer = await searchWikipediaAsFallback(queryText);
    if(backupAnswer) {
        return backupAnswer;
    }

    return "❌ Извините, сервера сейчас сильно перегружены, и я не смог найти ответ. Пожалуйста, подождите пару минут и попробуйте снова.";
}

async function send(){
    let input = document.getElementById("input");
    let text = input.value.trim();
    if(!text) return;
    
    add(text, "user");
    input.value = "";

    // 1. Ищем в базе Firebase
    let res = brain(text);
    if(res){
        setTimeout(() => { add(res, "ai"); }, 300);
        return;
    }

    // 2. Спрашиваем ИИ (или Википедию)
    let loadingMsg = add("💭 Анализирую...", "ai");
    let finalAnswer = await askSmartAI(text);
    
    loadingMsg.innerText = finalAnswer;
    if (finalAnswer.length < 400 && !finalAnswer.includes("❌")) speakText(finalAnswer);
    
    // 3. Сохраняем в Firebase навсегда (только если ответ успешный)
    if(!finalAnswer.includes("❌") && !finalAnswer.includes("Сервер ИИ перегружен")) {
        let userInput = text.toLowerCase().trim();
        memory[userInput] = finalAnswer;
        if (db) {
            db.ref('serik_memory').set(memory);
        }
    }
}
</script>
</body>
</html>
