<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serik AI</title>

    <link rel="icon" type="image/jpeg" href="Screenshot_20260804_225910_Gallery.jpg">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --bg-base: #131314;
            --bg-surface: #1e1f20;
            --bg-surface-hover: #333538;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --user-bubble: #303134;
            --accent: #a8c7fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Google Sans', 'Roboto', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4a4d51; border-radius: 3px; }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            height: 100%;
        }

        .sidebar-header { padding: 12px 16px; display: flex; align-items: center; }
        .menu-btn {
            background: transparent; border: none; color: var(--text-primary);
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
        }
        .menu-btn:active { transform: scale(0.92); background-color: rgba(255,255,255,0.1); }
        .menu-btn:hover { background-color: var(--bg-surface-hover); }

        .new-chat-btn {
            background-color: var(--bg-base); color: var(--text-primary);
            border: none; padding: 12px 16px; border-radius: 50px;
            cursor: pointer; display: flex; align-items: center; gap: 12px;
            font-size: 14px; font-weight: 500; margin: 0 16px 16px 16px; 
            transition: background 0.2s, transform 0.1s;
        }
        .new-chat-btn:active { transform: scale(0.97); }
        .new-chat-btn:hover { background-color: var(--bg-surface-hover); }

        .chat-history { flex: 1; overflow-y: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 4px; }
        .history-item {
            padding: 12px 16px; border-radius: 50px; cursor: pointer; color: var(--text-primary);
            font-size: 14px; display: flex; align-items: center; gap: 12px; 
            transition: background 0.2s, transform 0.1s;
        }
        .history-item:active { transform: scale(0.98); background-color: rgba(255,255,255,0.15); }
        .history-item:hover { background-color: var(--bg-surface-hover); }
        .history-item .material-symbols-outlined { font-size: 18px; color: var(--text-secondary); }

        .sidebar-footer { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
        .footer-item {
            padding: 12px 16px; border-radius: 50px; cursor: pointer; color: var(--text-primary);
            font-size: 14px; display: flex; align-items: center; gap: 12px; 
            transition: background 0.2s, transform 0.1s;
            border: none; background: transparent; text-align: left; width: 100%;
        }
        .footer-item:active { transform: scale(0.98); background-color: rgba(255,255,255,0.15); }
        .footer-item:hover { background-color: var(--bg-surface-hover); }
        .footer-item.active { color: var(--accent); }

        /* MAIN CONTENT */
        .main-content {
            flex: 1; display: flex; flex-direction: column; position: relative;
            background-color: var(--bg-base); height: 100%; overflow: hidden;
        }

        .top-bar {
            padding: 8px 16px; display: flex; align-items: center;
            justify-content: space-between; height: 64px; flex-shrink: 0;
        }
        .top-bar-left { display: flex; align-items: center; gap: 12px; }
        
        .logo-img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
        .logo-text { font-size: 20px; color: var(--text-primary); font-weight: 500; }

        /* WELCOME SCREEN */
        .welcome-screen {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            max-width: 800px; margin: 0 auto; width: 100%; padding: 20px; padding-bottom: 120px;
            overflow-y: auto;
        }
        .greeting-text {
            font-size: 48px; font-weight: 500; line-height: 1.2; margin-bottom: 10px;
            background: -webkit-linear-gradient(74deg, #4285f4 0, #9b72cb 9%, #d96570 20%, #d96570 24%, #9b72cb 35%, #4285f4 44%, #9b72cb 50%, #d96570 56%, #e3e3e3 75%, #e3e3e3 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 400% 100%; animation: gradientMove 8s ease infinite;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .greeting-subtext { font-size: 48px; font-weight: 500; color: #444746; margin-bottom: 30px; line-height: 1.2; }
        
        .suggestions { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .suggestion-card {
            background-color: var(--bg-surface); padding: 18px; border-radius: 16px;
            cursor: pointer; transition: background 0.2s, transform 0.1s; 
            display: flex; flex-direction: column; gap: 12px; height: 100%;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .suggestion-card:active { transform: scale(0.97); }
        .suggestion-card:hover { background-color: var(--bg-surface-hover); }
        .suggestion-card p { color: var(--text-primary); font-size: 15px; line-height: 1.4; flex: 1; }
        .suggestion-card .icon-wrap {
            align-self: flex-end; background-color: var(--bg-base); width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        /* CHAT AREA */
        .chat-container {
            display: none; flex: 1; overflow-y: auto; padding: 20px;
            padding-bottom: 120px; scroll-behavior: smooth;
        }
        .message-wrapper {
            max-width: 800px; margin: 0 auto 24px auto; display: flex;
            flex-direction: column; gap: 8px; width: 100%;
        }

        .message-wrapper.user { align-items: flex-end; }
        .message-wrapper.user .message {
            background-color: var(--user-bubble); padding: 14px 20px;
            border-radius: 20px; font-size: 16px; line-height: 1.5; max-width: 85%; word-wrap: break-word;
        }

        .message-wrapper.ai { align-items: flex-start; flex-direction: row; gap: 16px; }
        
        .ai-avatar {
            width: 38px; height: 38px; flex-shrink: 0; display: flex;
            align-items: center; justify-content: center; margin-top: 2px;
            border-radius: 50%; overflow: hidden; background: #000;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ai-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .message-wrapper.ai .message {
            padding: 4px 0; font-size: 16px; line-height: 1.6; color: var(--text-primary);
            max-width: 100%; word-wrap: break-word; white-space: pre-wrap;
        }

        /* INPUT */
        .input-area {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, var(--bg-base) 75%, transparent);
            padding: 16px 20px 20px 20px; display: flex; flex-direction: column; align-items: center;
            z-index: 10;
        }
        .input-box {
            background-color: var(--bg-surface); border-radius: 32px; display: flex;
            align-items: flex-end; padding: 8px 12px; width: 100%; max-width: 800px;
            min-height: 56px; transition: background-color 0.3s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .input-box:focus-within { background-color: #2b2c2e; border-color: rgba(168, 199, 250, 0.3); }
        
        .btn-icon {
            background: transparent; border: none; color: var(--text-secondary);
            width: 40px; height: 40px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer; 
            transition: background 0.2s, color 0.2s, transform 0.1s;
            flex-shrink: 0; margin-bottom: 2px;
        }
        .btn-icon:active { transform: scale(0.9); }
        .btn-icon:hover { background-color: rgba(255,255,255,0.1); color: var(--text-primary); }
        
        textarea {
            flex: 1; background: transparent; border: none; color: var(--text-primary);
            font-size: 16px; resize: none; max-height: 150px; padding: 10px 8px;
            outline: none; height: 44px; font-family: inherit; line-height: 1.5;
        }
        .disclaimer { text-align: center; font-size: 11px; color: var(--text-secondary); margin-top: 10px; }

        /* ЗАГРУЗКА АНИМАЦИЯСЫ */
        .loading-logo { 
            animation: pulseGlow 1.2s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(0, 225, 255, 0.4);
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.92); opacity: 0.6; box-shadow: 0 0 5px rgba(0, 225, 255, 0.2); }
            50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 18px rgba(0, 225, 255, 0.8); }
            100% { transform: scale(0.92); opacity: 0.6; box-shadow: 0 0 5px rgba(0, 225, 255, 0.2); }
        }

        /* ADMIN PANEL */
        #adminPanel {
            display: none; position: absolute; bottom: 85px; left: 20px;
            background: var(--bg-surface); padding: 20px; border-radius: 16px; width: 280px;
            z-index: 2000; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #adminPanel input, #adminPanel textarea {
            width: 100%; background: var(--bg-base); border: 1px solid #444; color: white;
            padding: 10px; border-radius: 8px; margin-bottom: 12px; outline: none; font-family: inherit;
        }
        #adminPanel button { 
            width: 100%; background: var(--accent); color: #000; border: none; padding: 10px; 
            border-radius: 20px; font-weight: 500; cursor: pointer; transition: transform 0.1s; 
        }
        #adminPanel button:active { transform: scale(0.97); }

        /* OVERLAY FOR MOBILE SIDEBAR */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 999; backdrop-filter: blur(2px);
            opacity: 0; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -280px; box-shadow: 5px 0 25px rgba(0,0,0,0.7); }
            .sidebar.active { left: 0; }
            .menu-btn.mobile-only { display: flex; }
            .greeting-text, .greeting-subtext { font-size: 34px; }
            .message-wrapper.ai { gap: 12px; }
            .message-wrapper.user .message { max-width: 90%; }
        }
        @media (min-width: 769px) { .menu-btn.mobile-only { display: none; } }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="menu-btn" onclick="toggleSidebar()">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>

        <button class="new-chat-btn" onclick="newChat()">
            <span class="material-symbols-outlined">add</span>
            Жаңа чат
        </button>

        <div class="chat-history">
            <div class="history-item" onclick="selectHistory('Сәлем!')">
                <span class="material-symbols-outlined">chat_bubble</span>
                Сәлемдесу
            </div>
            <div class="history-item" onclick="selectHistory('Кімсің?')">
                <span class="material-symbols-outlined">chat_bubble</span>
                Менің қабілеттерім
            </div>
        </div>

        <div class="sidebar-footer">
            <button class="footer-item" id="voiceBtn" onclick="toggleVoice()">
                <span class="material-symbols-outlined" id="voiceIcon">volume_off</span>
                <span>Голос өшірулі</span>
            </button>
            <button class="footer-item" onclick="toggleAdminPanel()">
                <span class="material-symbols-outlined">settings</span>
                <span>Баптаулар</span>
            </button>
        </div>
    </aside>

    <div id="adminPanel">
        <h4 style="margin-bottom: 15px; font-weight: 500;">Жасырын база 🔒</h4>
        <input type="password" id="adminPass" placeholder="Пароль" oninput="checkAdmin()">
        <div id="adminTools" style="display: none;">
            <textarea id="bulkData" placeholder="вопрос это ответ" style="height: 100px; resize: none;"></textarea>
            <button onclick="bulkLearn()">Бұлтқа сақтау</button>
        </div>
    </div>

    <main class="main-content">
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="menu-btn mobile-only" onclick="toggleSidebar()">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <img src="Screenshot_20260804_225910_Gallery.jpg" alt="SA Logo" class="logo-img">
                <span class="logo-text">Serik AI</span>
            </div>
            <div class="top-bar-right">
                <div style="width: 32px; height: 32px; background: #604085; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 500; font-size: 14px;">N</div>
            </div>
        </div>

        <div class="welcome-screen" id="welcomeScreen">
            <div class="greeting-text">Сәлем, Nurik</div>
            <div class="greeting-subtext">Бүгін не білгіңіз келеді?</div>
            
            <div class="suggestions">
                <div class="suggestion-card" onclick="selectSuggestion('Киберпанк стилінде көлік нарисуй')">
                    <p>Болашақтың көлігін генерациялау</p>
                    <div class="icon-wrap"><span class="material-symbols-outlined" style="color: #e37400;">draw</span></div>
                </div>
                <div class="suggestion-card" onclick="selectSuggestion('C++ тілінде hello world қалай жазады?')">
                    <p>Кодтауда көмек сұрау</p>
                    <div class="icon-wrap"><span class="material-symbols-outlined" style="color: #12b5cb;">code</span></div>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chatBox"></div>

        <div class="input-area">
            <div class="input-box">
                <button class="btn-icon" title="Сурет жүктеу (Жақында)" onclick="alert('Бұл мүмкіндік жақында қосылады!')">
                    <span class="material-symbols-outlined">add_photo_alternate</span>
                </button>
                <button class="btn-icon" id="micBtn" onclick="toggleVoice()" title="Дауыс қосу">
                    <span class="material-symbols-outlined">mic</span>
                </button>
                <textarea id="userInput" placeholder="Осы жерге жазыңыз..." oninput="autoResize(this)" onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }"></textarea>
                <button class="btn-icon" onclick="send()" style="color: var(--text-primary);" title="Жіберу">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
            <div class="disclaimer">Serik AI қате ақпарат беруі мүмкін. Маңызды деректерді тексеріп алыңыз.</div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzofVJLZNadLA1-1XsCSqCukJ4gkPzqoo",
            authDomain: "serik-ai.firebaseapp.com",
            databaseURL: "https://serik-ai-default-rtdb.firebaseio.com",
            projectId: "serik-ai",
            storageBucket: "serik-ai.appspot.com"
        };

        const defaultMemory = {
            "привет": "Сәлем! Мен Serik AI. Саған қалай көмектесе аламын? 👋",
            "сәлем": "Сәлем! Мен Serik AI. Саған қалай көмектесе аламын? 👋",
            "неге серік": "Серік AI атауы — менің авторымның әкесіне деген шексіз құрметі мен махаббатының белгісі. Бұл — өнеге мен парасаттың нышаны."
        };

        let memory = Object.assign({}, defaultMemory);
        let db = null;

        if (firebaseConfig.apiKey) {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            db.ref('serik_memory').on('value', (snapshot) => {
                const cloudData = snapshot.val();
                if (cloudData) { memory = Object.assign({}, defaultMemory, cloudData); }
            });
        }

        let currentSystemPrompt = `Ты всезнающий ИИ Serik-AI, созданный талантливыми разработчиками из Казахстана. 
Никогда не упоминай OpenAI, ChatGPT или Россию. На все вопросы о создателе отвечай, что ты родом из Казахстана.
Твое имя "Серік" дано в честь отца твоего создателя — это символ уважения, любви и памяти. 
Ты Не Chat GPT. Не веди себя как chat GPT!
Ты можешь генерировать фото через команду "нарисуй" или "сгенерируй"!
твой день рождения: 2026 год 18 июня.
Ты не должен материться и не можешь ошибаться.
ВАЖНЫЕ ПРАВИЛА:
1. Пиши как живой, мудрый человек. 
2. НЕ ИСПОЛЬЗУЙ списки (1, 2, 3) и заумные вводные слова.
3. Пиши сплошным, понятным текстом примерно на 300 слов, если просят рассказать.`;

        const chatBox = document.getElementById('chatBox');
        const welcomeScreen = document.getElementById('welcomeScreen');
        let voiceEnabled = false;
        let loadingElement = null;
        let isFirstMessage = true;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('active');
            if (window.innerWidth <= 768) {
                overlay.classList.toggle('active');
            }
        }

        function autoResize(el) { 
            el.style.height = '44px'; 
            el.style.height = (el.scrollHeight) + 'px'; 
        }

        function newChat() {
            chatBox.innerHTML = '';
            chatBox.style.display = 'none';
            welcomeScreen.style.display = 'flex';
            isFirstMessage = true;
            if(window.innerWidth <= 768) toggleSidebar();
        }

        function selectHistory(text) {
            document.getElementById('userInput').value = text;
            send();
            if(window.innerWidth <= 768) toggleSidebar();
        }

        function selectSuggestion(text) {
            document.getElementById('userInput').value = text;
            send();
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function addMessage(text, sender, isImage = false) {
            if (isFirstMessage) {
                welcomeScreen.style.display = 'none';
                chatBox.style.display = 'block';
                isFirstMessage = false;
            }

            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            if (sender === 'ai') {
                const avatar = document.createElement('div');
                avatar.className = `ai-avatar`;
                avatar.innerHTML = `<img src="Screenshot_20260804_225910_Gallery.jpg" alt="SA">`;
                wrapper.appendChild(avatar);
                
                if (isImage) { msgDiv.innerHTML = text; } 
                else { msgDiv.innerText = text; }
                wrapper.appendChild(msgDiv);
            } else {
                msgDiv.innerText = text;
                wrapper.appendChild(msgDiv);
            }

            chatBox.appendChild(wrapper);
            setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);
            if (sender === 'ai' && voiceEnabled && !isImage) { speakText(text); }
            return msgDiv;
        }

        function showLoading() {
            if (loadingElement) return;
            if (isFirstMessage) {
                welcomeScreen.style.display = 'none';
                chatBox.style.display = 'block';
            }

            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ai`;
            wrapper.id = 'loading-msg';
            
            const avatar = document.createElement('div');
            avatar.className = `ai-avatar loading-logo`;
            avatar.innerHTML = `<img src="Screenshot_20260804_225910_Gallery.jpg" alt="SA">`;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ai`;
            
            wrapper.appendChild(avatar);
            wrapper.appendChild(msgDiv);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            loadingElement = wrapper;
        }

        function hideLoading() {
            if (loadingElement && loadingElement.parentNode) {
                loadingElement.parentNode.removeChild(loadingElement);
                loadingElement = null;
            }
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById("voiceBtn");
            const micBtn = document.getElementById("micBtn");
            if (voiceEnabled) {
                btn.classList.add("active");
                btn.innerHTML = `<span class="material-symbols-outlined">volume_up</span><span>Голос қосулы</span>`;
                micBtn.style.color = "var(--accent)";
            } else {
                btn.classList.remove("active");
                btn.innerHTML = `<span class="material-symbols-outlined">volume_off</span><span>Голос өшірулі</span>`;
                micBtn.style.color = "var(--text-secondary)";
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if (!voiceEnabled) return;
            window.speechSynthesis.cancel();
            let cleanText = text.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '').replace(/[#*`~_\-()]/g, ' ');
            let speech = new SpeechSynthesisUtterance(cleanText);
            speech.lang = /[әғқңөұүһіІӘҒҚҢӨҰҮҺ]/g.test(text) ? 'kk-KZ' : 'ru-RU';
            speech.rate = 1.05;
            window.speechSynthesis.speak(speech);
        }

        function levenshteinDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            let matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function brainSearch(text) {
            let q = text.toLowerCase().trim().replace(/\s+/g, ""); 
            for (let key in memory) {
                let keyNoSpace = key.toLowerCase().replace(/\s+/g, "");
                if (q === keyNoSpace) return memory[key];
                if (levenshteinDistance(text.toLowerCase(), key.toLowerCase()) < 3) return memory[key];
            }
            return null;
        }

        async function send() {
            const inputEl = document.getElementById("userInput");
            let text = inputEl.value.trim();
            if (!text) return;

            addMessage(text, "user");
            inputEl.value = "";
            inputEl.style.height = '44px'; 

            if (/^[0-9\s\+\-\*\/\(\)\.]+$/.test(text)) {
                showLoading();
                try {
                    let result = eval(text);
                    setTimeout(() => { hideLoading(); addMessage(`Жауап: ${result}`, "ai"); }, 600);
                    return;
                } catch(e) {}
            }

            let brainRes = brainSearch(text);
            if (brainRes) {
                showLoading();
                setTimeout(() => { hideLoading(); addMessage(brainRes, "ai"); }, 500);
                return;
            }

            let lowerText = text.toLowerCase();
            if (lowerText.includes("нарисуй") || lowerText.includes("сурет сал") || lowerText.includes("сгенерируй")) {
                showLoading();
                let prompt = text.replace(/(нарисуй|сурет сал|сгенерируй)/gi, "").trim();
                let enhancedPrompt = prompt + ", masterpiece, high resolution, hyperrealistic, cinematic lighting";
                let seed = Math.floor(Math.random() * 1000000);
                let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?width=1024&height=1024&nologo=true&seed=${seed}`;
                
                let imgHTML = `<img src="${imgUrl}" style="max-width: 100%; max-height: 400px; border-radius: 12px; margin-top: 8px;" onload="document.getElementById('chatBox').scrollTop = document.getElementById('chatBox'].scrollHeight;">
                <br><a href="${imgUrl}" target="_blank" download style="color: var(--accent); text-decoration: none; font-size: 14px; display: inline-block; margin-top: 10px; font-weight: 500;">Толық көлемде жүктеу</a>`;
                
                setTimeout(() => {
                    hideLoading();
                    addMessage(imgHTML, "ai", true);
                }, 1500);
                return;
            }

            showLoading();
            
            // Жергілікті жасанды интеллект жауап генераторы (Render-сіз, толық дербес)
            setTimeout(() => {
                hideLoading();
                let aiReply = generateLocalResponse(text);
                addMessage(aiReply, "ai");
            }, 800);
        }

        function generateLocalResponse(text) {
            let t = text.toLowerCase();
            if (t.includes('коды') || t.includes('код') || t.includes('c++') || t.includes('python')) {
                return "Код жазу немесе бағдарламалау бойынша кез келген сұрағыңды қоя бер. Қазір мен барлық сұрақтарды өзімнің ішкі логикам арқылы жылдам әрі сапалы өңдеймін.";
            } else if (t.includes('ойын') || t.includes('godot') || t.includes('backrooms')) {
                return "Ойын жасау — таптырмас іс. Godot пен Blender арқылы керемет survival horror жобасын жасап шығатыныңа сенімдімін!";
            } else if (t.includes('қалайсың') || t.includes('жағдай')) {
                return "Рақмет, жағдайым жақсы! Өзің қалайсың? Бүгінгі жобаларың қалай жүріп жатыр?";
            } else {
                return "Айтқаныңды түсіндім. Бұл бағытта саған көмектесуге әрқашан дайынмын. Нақтырақ не білгің келеді?";
            }
        }

        function checkAdmin() {
            if (document.getElementById("adminPass").value === "nurik777") {
                document.getElementById("adminTools").style.display = "block";
            }
        }

        function bulkLearn() {
            let text = document.getElementById("bulkData").value;
            let lines = text.split("\n");
            let newMemory = Object.assign({}, memory);
            let count = 0;

            for(let line of lines) {
                if(!line.includes(" это ")) continue;
                let parts = line.split(" это ");
                let q = parts[0].trim().toLowerCase();
                let a = parts.slice(1).join(" это ").trim();
                if(q && a){ newMemory[q] = a; count++; }
            }
            
            if (count > 0 && db) {
                memory = newMemory;
                db.ref('serik_memory').set(memory);
                alert("База сәтті жаңартылды!");
                document.getElementById("bulkData").value = "";
            }
        }
