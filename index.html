<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Serik AI Pro | DuckDuckGo Edition</title>

<meta name="google-site-verification" content="google9a22931bc29d7cd7" />

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f0f14; color: white; display: flex; height: 100vh; overflow: hidden; transition: background 0.4s, color 0.4s; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #00b86b; }

.sidebar { width: 280px; background: #1a1a24; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; z-index: 10; box-shadow: 2px 0 15px rgba(0,0,0,0.5); }
.sidebar h3 { text-align: center; margin-top: 0; font-size: 22px; text-transform: uppercase; color: #00b86b; text-shadow: 0 0 10px rgba(0,184,107,0.3); }

#menuToggle { background: #2b2b3a; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
.settings-menu { display: none; flex-direction: column; gap: 10px; background: #111118; padding: 15px; border-radius: 10px; border: 1px solid #333; margin-top: -5px; }
.settings-menu.open { display: flex; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: transparent; position: relative; height: 100vh; }
.chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; scroll-behavior: smooth; }

.msg { padding: 14px 18px; margin: 8px 0; border-radius: 14px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); line-height: 1.5; font-size: 15px; }
.user { background: linear-gradient(135deg, #00b86b, #008f53); margin-left: auto; color: white; border-bottom-right-radius: 4px; }
.ai { background: linear-gradient(135deg, #2b2b3a, #20202d); margin-right: auto; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }

.row { display: flex; border-top: 1px solid #222; background: #111; padding: 15px; gap: 10px; z-index: 10; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
input, textarea { width: 100%; padding: 14px; border: 1px solid #333; border-radius: 8px; outline: none; background: #16161a; color: white; font-size: 16px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }
button, select { padding: 12px; background: #00b86b; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; font-size: 15px; }
select { background: #2b2b3a; width: 100%; }

.generators { display: flex; gap: 10px; padding: 12px 15px; background: #1a1a24; border-top: 1px solid #2b2b3a; overflow-x: auto; white-space: nowrap; }
.generators button { background: #2b2b3a; padding: 8px 14px; font-size: 13px; border: 1px solid #444; border-radius: 20px; font-weight: normal; }

.loading-dots span { animation: blink 1.4s infinite both; }
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }

@media (max-width: 768px) {
    body { flex-direction: column; height: 100vh; position: fixed; width: 100%; }
    .sidebar { width: 100%; height: auto; max-height: 120px; padding: 8px 12px; gap: 4px; }
    .sidebar h3 { font-size: 16px; margin: 0 0 2px 0; }
    .main { height: calc(100vh - 120px); }
    .chat { padding-bottom: 70px; } 
    .row { padding: 10px; position: fixed; bottom: 0; left: 0; width: 100%; }
}
</style>
</head>
<body>

<div class="sidebar">
    <h3>🦆 DDG AI Engine</h3>
    <button id="menuToggle" onclick="toggleSettings()">⚙️ Настройки <span>🔽</span></button>
    <div id="settingsMenu" class="settings-menu">
        <button id="voiceBtn" onclick="toggleVoice()">🔇 Голос: ВЫКЛ</button>
    </div>
</div>

<div class="main">
    <div class="chat" id="chat"></div>
    
    <div class="generators">
        <button onclick="generateText('Эссе Казахстан')">📜 Эссе</button>
        <button onclick="generateText('Реферат Искусственный интеллект')">📑 Реферат</button>
        <button onclick="generateText('Что такое черная дыра')">🌌 Поиск инфо</button>
    </div>

    <div class="row">
        <input id="input" placeholder="Введите ваш вопрос..." onkeydown="if(event.key==='Enter') send()">
        <button onclick="send()">Отправить</button>
    </div>
</div>

<script>
let voiceEnabled = false;
const chat = document.getElementById("chat");

function toggleSettings() {
    let menu = document.getElementById("settingsMenu");
    menu.classList.toggle("open");
}

function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    document.getElementById("voiceBtn").innerText = voiceEnabled ? "🔊 Голос: ВКЛ" : "🔇 Голос: ВЫКЛ";
}

function speakText(text) {
    if (!voiceEnabled) return;
    window.speechSynthesis.cancel(); 
    let cleanText = text.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}📋✅⚛️📜🔥💻🛋️🤖👨‍🏫😎✨]/gu, '');
    let speech = new SpeechSynthesisUtterance(cleanText);
    speech.lang = /[әғқңөұүһіІӘҒҚҢӨҰҮҺ]/g.test(text) ? 'kk-KZ' : 'ru-RU';
    window.speechSynthesis.speak(speech);
}

let loadingIndicator = null;
function showLoading() {
    if(loadingIndicator) return;
    loadingIndicator = document.createElement("div");
    loadingIndicator.className = "msg ai";
    loadingIndicator.innerHTML = `Ищу в базе DuckDuckGo <span class="loading-dots"><span>.</span><span>.</span><span>.</span></span> 🦆`;
    chat.appendChild(loadingIndicator);
    chat.scrollTop = chat.scrollHeight;
}
function hideLoading() {
    if (loadingIndicator) chat.removeChild(loadingIndicator);
    loadingIndicator = null;
}

function add(text, type) {
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    if (type === 'ai') speakText(text);
}

function generateText(prompt) {
    document.getElementById("input").value = prompt;
    send();
}

// ============================================
// DUCKDUCKGO ЖӘНЕ ИИ-ФИЛЬТР ЛОГИКАСЫ (ОСЫ ЖЕРДЕ)
// ============================================
async function fetchDuckDuckGo(queryText) {
    // 1. ИИ Фильтр: Сұрақты тазалау және мақсатын анықтау
    let isEssay = /эссе|шығарма/i.test(queryText);
    let isReferat = /реферат|доклад/i.test(queryText);
    
    // Тек қана негізгі сөзді қалдыру үшін артық сөздерді қиып тастау
    let cleanQuery = queryText.replace(/(напиши|жаз|маған|құрастыр|реферат|эссе|шығарма|пожалуйста|расскажи про|что такое|кто такой|найди|туралы|деген не|не ол)/gi, "").trim();

    if (!cleanQuery) return "❌ Тақырыпты анық жазыңыз. Мысалы: 'Реферат Абай Құнанбаев' немесе 'Что такое космос'.";

    try {
        // DuckDuckGo API-ге жіберу
        let searchUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery)}&format=json&no_html=1&skip_disambig=1`;
        let res = await fetch(searchUrl);
        let data = await res.json();

        let mainText = data.AbstractText || data.Abstract;
        let title = data.Heading || cleanQuery;
        let related = data.RelatedTopics || [];

        // Ешқандай ақпарат табылмаса
        if (!mainText && related.length === 0) {
            return `🦆 DuckDuckGo базасынан "${cleanQuery}" туралы мәлімет табылмады. Басқаша сұрап көріңіз немесе ағылшынша/орысша жазып көріңіз.`;
        }

        // 2. ЭССЕ НЕМЕСЕ РЕФЕРАТ ҚҰРАСТЫРУ
        if (isEssay || isReferat) {
            let docType = isEssay ? "📜 Эссе" : "📑 Реферат";
            let intro = mainText ? mainText : "Бұл тақырып бойынша негізгі мәліметтер төменде келтірілген.";
            
            // Қосымша фактілерді генерациялау (RelatedTopics арқылы)
            let bodyContent = "";
            if (related.length > 0) {
                bodyContent = "\n\n📌 Негізгі фактілер мен ерекшеліктер:\n";
                let count = 0;
                for(let item of related) {
                    if (item.Text && count < 5) { // 5 фактіге дейін аламыз
                        bodyContent += `• ${item.Text.split(" - ")[0]}\n`;
                        count++;
                    }
                }
            } else {
                bodyContent = "\n\nБұл тақырып өте ауқымды және жан-жақты зерттеуді қажет етеді.";
            }

            // Құрастырылған құжатты қайтару
            return `${docType} Тақырыбы: ${title}\n\nКіріспе:\n${intro}${bodyContent}\n\nҚорытынды:\nҚорыта келе, бұл тақырып адамзат пен ғылым үшін маңызды орын алады. Бұл мәліметтер DuckDuckGo энциклопедиялық базасынан алынып, құрастырылды.`;
        } 
        
        // 3. Жай сұраққа жауап (эссе сұрамаса)
        else {
            if (mainText) {
                return `🦆 [DuckDuckGo базасы]:\n\n${mainText}`;
            } else if (related.length > 0 && related[0].Text) {
                return `🦆 [DuckDuckGo]:\n\n${related[0].Text}`;
            }
        }

    } catch (e) {
        return "❌ DuckDuckGo серверімен байланыс үзілді. Интернетті тексеріңіз.";
    }
}

async function send() {
    let input = document.getElementById("input");
    let text = input.value.trim();
    if(!text) return;
    
    add(text, "user");
    input.value = "";

    showLoading();
    let finalAnswer = await fetchDuckDuckGo(text); // Тек қана DuckDuckGo қолданылады
    hideLoading();
    add(finalAnswer, "ai");
}
</script>
</body>
</html>
