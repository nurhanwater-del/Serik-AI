        const chat = document.getElementById("chat");

        function toggleSettings() {
            let menu = document.getElementById("settingsMenu");

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            let btn = document.getElementById("voiceBtn");
            if (voiceEnabled) {
                btn.innerText = "🔊 Голос: ВКЛ";
                btn.classList.add("active");

                window.speechSynthesis.cancel();

        function speakText(text) {
            if (!voiceEnabled) return;
            window.speechSynthesis.cancel();
            let cleanText = text.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}📋✅⚛️📜🔥💻🛋️🤖👨‍🏫😎✨🎨📸🖼️💾🔍]/gu, '');
            cleanText = cleanText.replace(/[#*`~_\-()]/g, ' ');
            let speech = new SpeechSynthesisUtterance(cleanText);
            if (/[әғқңөұүһіІӘҒҚҢӨҰҮҺ]/g.test(text)) {
                speech.lang = 'kk-KZ';
            } else {
                speech.lang = 'ru-RU';
            }
            let voices = window.speechSynthesis.getVoices();
            let premiumVoice = voices.find(v => v.lang.startsWith(speech.lang.split('-')[0]) &&
                (/google|natural|premium|neural|microsoft|yuri|pavel/i.test(v.name)));
            if (premiumVoice) speech.voice = premiumVoice;
            else {
                let defaultLangVoice = voices.find(v => v.lang.startsWith(speech.lang.split('-')[0]));
                if (defaultLangVoice) speech.voice = defaultLangVoice;
            }
            speech.pitch = 1.0;
            speech.rate = 1.05;
            window.speechSynthesis.speak(speech);
        }
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

        let loadingIndicator = null;

        function showLoading() {
            if (loadingIndicator) return;
            loadingIndicator = document.createElement("div");

        function hideLoading() {

                loadingIndicator = null;

        }

        function add(text, type, instant = false) {
            let div = document.createElement("div");
            div.className = "msg " + type;
            let textSpan = document.createElement("span");
            div.appendChild(textSpan);

            if (type === "ai") {
                let copyBtn = document.createElement("button");
                copyBtn.innerText = "📋";
                copyBtn.className = "copy-btn";
                copyBtn.onclick = function() {
                    navigator.clipboard.writeText(text);
                    copyBtn.innerText = "✅";
                    setTimeout(() => { copyBtn.innerText = "📋"; }, 2000);
                };
                div.appendChild(copyBtn);
                chat.appendChild(div);

                if (!instant) {
                    let chars = [...text];
                    let i = 0;
                    let chunkSize = chars.length > 400 ? 4 : 1;
                    let timer = setInterval(() => {
                        if (i < chars.length) {
                            textSpan.innerText += chars.slice(i, i + chunkSize).join('');
                            i += chunkSize;
                            chat.scrollTop = chat.scrollHeight;
                        } else {
                            clearInterval(timer);
                            if (text.length < 500) speakText(text);
                        }
                    }, 12);
                } else {
                    textSpan.innerText = text;
                    if (text.length < 500) speakText(text);
                }
            } else {
                textSpan.innerText = text;
                chat.appendChild(div);
            }
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        add(`🔧 Технический перерыв

Текстовый ИИ временно недоступен из-за обновления серверов.

🧠 Мы улучшаем качество ответов и производительность системы.

📸 Также вы можете генерировать реалистичные фото Ultra HD — в левом верхнем углу нажмите на три точки → Photo.

⏳ Пожалуйста, попробуйте снова немного позже.

💚 Спасибо за понимание!`, "ai");

        function levenshteinDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            let matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1,
                            Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function brain(text) {
            let q = text.toLowerCase().trim();
            let qNoSpace = q.replace(/\s+/g, "");
            if (memory[q]) return memory[q];
            let bestMatch = null;
            let minDistance = 3;
            for (let key in memory) {
                let keyNoSpace = key.toLowerCase().replace(/\s+/g, "");
                if (qNoSpace === keyNoSpace) return memory[key];
                let dist = levenshteinDistance(q, key.toLowerCase());
                if (dist < minDistance) { minDistance = dist; bestMatch = key; }
            }
            if (bestMatch) return memory[bestMatch];
            return null;
        }

            let text = document.getElementById("bulk").value;
            let lines = text.split("\n");
            let count = 0;
            let newMemory = Object.assign({}, memory);
            for (let line of lines) {
                line = line.trim();
                if (!line.includes(" это ")) continue;
                let parts = line.split(" это ");
                let q = parts[0].trim().toLowerCase();
                let a = parts.slice(1).join(" это ").trim();
                if (q && a) { newMemory[q] = a; count++; }
            }
            if (count > 0) {
                memory = newMemory;
                if (db) {
                    db.ref('serik_memory').set(memory);
                    alert("✅ Успешно сохранено в облаке Firebase!");

            chat.innerHTML = "";
            chatHistory = [];
            add("Привет! Я Serik AI. Чат очищен и готов к работе! ✨", "ai", false);
        }

        function switchTab(tab) {
            const chatContainer = document.getElementById("chatContainer");
            const imagePanel = document.getElementById("imagePanel");
            const chatTabBtn = document.getElementById("chatTabBtn");
            const imagesTabBtn = document.getElementById("imagesTabBtn");

            if (tab === 'chat') {
                chatContainer.style.display = 'flex';
                imagePanel.classList.remove('active');
                chatTabBtn.classList.add('active');
                imagesTabBtn.classList.remove('active');
            } else {
                chatContainer.style.display = 'none';
                imagePanel.classList.add('active');
                chatTabBtn.classList.remove('active');
                imagesTabBtn.classList.add('active');
            }
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function setPrompt(text) {
            document.getElementById('imagePrompt').value = text;
        }

        let currentAspect = '1:1';
        let currentQuality = '4k';

        document.getElementById('aspectRatioGroup').addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentAspect = e.target.dataset.ratio;
            }
        });

        document.getElementById('qualityGroup').addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentQuality = e.target.dataset.quality;
            }
        });

        // 🔥 ULTRA REALISTIC размеры
        function getImageDimensions(aspect, quality) {
            const table = {
                '1:1':  { hd: [1024, 1024], '1080p': [1536, 1536], '4k': [2048, 2048] },
                '16:9': { hd: [1280, 720],  '1080p': [1920, 1080], '4k': [2560, 1440] },
                '9:16': { hd: [720, 1280],  '1080p': [1080, 1920], '4k': [1440, 2560] }
            };
            return table[aspect][quality] || [2048, 2048];
        }

        // 🔥 МАКСИМАЛДЫ РЕАЛИСТІК промпт
        function enhancePrompt(prompt, quality) {
            const base = prompt;

            const realisticTags = ', RAW photo, professional photography, shot on Canon EOS R5, 85mm f/1.4 lens, ' +
                'ultra realistic, photorealistic, hyperdetailed, skin pores visible, natural skin texture, ' +
                'fine hair details, subsurface scattering, cinematic lighting, natural lighting, ' +
                'golden hour, soft shadows, depth of field, bokeh, sharp focus on subject, ' +
                'high dynamic range, HDR, 8k uhd, dslr, film grain, color graded, masterpiece, award winning photo';

            const qualityTags = quality === '4k'
                ? ', extremely detailed, ultra sharp, tack sharp, professional color grading, editorial photography, National Geographic style'
                : quality === '1080p'
                ? ', highly detailed, sharp, professional'
                : ', detailed, high quality';

            const negativeTags = ' --no cartoon, anime, painting, illustration, drawing, sketch, 3d render, cgi, ' +
                'digital art, low quality, blurry, distorted, deformed, ugly, amateur, plastic skin, ' +
                'smooth skin, wax figure, doll, watermark, text, logo, signature, extra fingers, bad anatomy';

            return `${base}${realisticTags}${qualityTags}${negativeTags}`;
        }

        async function generateImage(promptText, container = null) {
            const userPrompt = promptText.replace(/(нарисуй|сурет сал|сгенерируй|draw|generate image|create image|generate a picture)/gi, '').trim();
            if (!userPrompt) {
                if (container) container.innerHTML = '<p style="color:#ff6b6b;">❌ Промпт пуст. Напишите описание.</p>';
                return;
            }

            const [w, h] = getImageDimensions(currentAspect, currentQuality);
            const enhanced = enhancePrompt(userPrompt, currentQuality);
            const seed = Math.floor(Math.random() * 1000000000);

            // 🔥 3 модель каскады — реализм үшін
            const models = ['flux-realism', 'flux', 'turbo'];
            const buildUrl = (model) =>
                `https://image.pollinations.ai/prompt/${encodeURIComponent(enhanced)}?width=${w}&height=${h}&nologo=true&seed=${seed}&model=${model}&enhance=true&private=true&safe=false`;

            const loadingHtml = `
                <div class="gen-loading">
                    📸 Генерирую реалистичное фото ${w}×${h}...<br>
                    <small style="color:#888;">~10-20 секунд, фотореализм требует времени</small>
                </div>`;

            if (container) {
                container.innerHTML = loadingHtml;
            } else {
                container = add(loadingHtml, 'ai', true);
            }

            for (const model of models) {
                try {
                    const response = await fetch(buildUrl(model));
                    if (!response.ok) continue;
                    const blob = await response.blob();

                    if (blob.type.startsWith('image/')) {
                        const imgUrl = URL.createObjectURL(blob);
                        const successHtml = `
                            <img src="${imgUrl}" alt="AI Realistic Photo">
                            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;">
                                <a href="${imgUrl}" download="serik_realistic_${Date.now()}.jpg"
                                   style="display:inline-block; padding:10px 20px; background:linear-gradient(135deg,#00b86b,#008f53); color:white; border-radius:8px; text-decoration:none; font-weight:bold;">
                                   💾 Скачать фото
                                </a>
                                <a href="${imgUrl}" target="_blank"
                                   style="display:inline-block; padding:10px 20px; background:#2b2b3a; color:white; border-radius:8px; text-decoration:none; font-weight:bold;">
                                   🔍 Открыть полностью
                                </a>
                            </div>
                            <p style="margin-top:10px; color:#888; font-size:12px;">
                                ✨ Модель: ${model} | ${w}×${h} | Реализм: ULTRA
                            </p>`;

                        if (container && container.innerHTML !== undefined) {
                            container.innerHTML = successHtml;
                        }
                        return;
                    }
                } catch (e) {
                    console.warn('Модель ' + model + ' не сработала:', e);
                }
            }

            const errorHtml = '<p style="color:#ff6b6b;">❌ Не удалось создать фото. Попробуйте ещё раз или измените промпт.</p>';
            if (container && container.innerHTML !== undefined) {
                container.innerHTML = errorHtml;
            }
        }

        function generateImageFromPanel() {
            const promptInput = document.getElementById('imagePrompt');
            const container = document.getElementById('generatedImageContainer');
            const prompt = promptInput.value.trim();
            if (!prompt) {
                container.innerHTML = '<p style="color:#ff6b6b;">❌ Напишите промпт!</p>';
                return;
            }
            generateImage(prompt, container);
        }

        async function send() {
            let input = document.getElementById("input");
            let text = input.value.trim();
            if (!text) return;

            add(text, "user");
            input.value = "";

            if (/^[0-9\s\+\-\*\/\(\)\.]+$/.test(text)) {
                showLoading();
                try {
                    let mathResult = eval(text);
                    setTimeout(() => {
                        hideLoading();
                        add(`🧮 Ответ: ${mathResult}`, "ai");
                    }, 700);
                    return;
                } catch (e) {}
            }

            let res = brain(text);
            if (res) {
                showLoading();
                setTimeout(() => {
                    hideLoading();
                    add(res, "ai");
                }, 400);
                return;
            }

            let lowerText = text.toLowerCase();

            let imgUrlMatch = text.match(/https?:\/\/\S+\.(?:png|jpg|jpeg|webp|gif)/i);
            if (imgUrlMatch) {
                showLoading();
                let detectedImageUrl = imgUrlMatch[0];
                let cleanQuestion = text.replace(detectedImageUrl, "").trim() || "Что на этом изображении?";
                try {
                    let visionUrl = `https://text.pollinations.ai/${encodeURIComponent(cleanQuestion)}?image=${encodeURIComponent(detectedImageUrl)}&model=openai`;
                    let r = await fetch(visionUrl);
                    let responseText = await r.text();
                    hideLoading();
                    add(`👁️ [Анализ изображения]:\n\n${responseText.trim()}`, "ai");
                    return;
                } catch (e) {
                    console.error("Ошибка Vision API:", e);
                }
            }

            if (lowerText.includes("нарисуй") || lowerText.includes("сурет сал") || lowerText.includes("сгенерируй")) {
                hideLoading();
                add("📸 Для реалистичных фото перейдите во вкладку **Photo** в боковом меню. Там доступен 4K Ultra Realistic режим!", "ai");
                return;
            }

            hideLoading();
            add("🔧 Технический перерыв! Попробуйте спросить иначе или перейдите во вкладку Photo для реалистичной генерации.", "ai");
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
    </script>
</body>
</html>
