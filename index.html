<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SERIK AI</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: white; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        .header { 
            background-color: #1a1a2e; 
            text-align: center; 
            padding: 12px; 
            font-weight: bold; 
            font-size: 18px;
            letter-spacing: 1px;
            color: #4ade80;
        }
        .settings-bar { 
            background-color: #232336; 
            padding: 12px 15px; 
            display: flex; 
            justify-content: space-between; 
            font-size: 14px; 
            border-bottom: 1px solid #333; 
            border-radius: 8px;
            margin: 5px;
        }
        .chat-container { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .message { 
            max-width: 85%; 
            padding: 12px 16px; 
            border-radius: 12px; 
            line-height: 1.4; 
            font-size: 15px;
            word-wrap: break-word; 
        }
        .bot-message { 
            background-color: #232336; 
            color: #fff; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
        }
        .user-message { 
            background-color: #00a859; 
            color: #fff; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px; 
        }
        .input-area { 
            display: flex; 
            padding: 10px; 
            gap: 8px; 
            background-color: #121212; 
            align-items: center; 
        }
        .clear-btn { 
            background-color: #ff4757; 
            color: white; 
            border: none; 
            padding: 12px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
        }
        .input-box { 
            flex: 1; 
            background-color: #232336; 
            color: white; 
            border: 1px solid #333; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 15px; 
            outline: none; 
        }
        .input-box::placeholder { color: #888; }
        .send-btn { 
            background-color: #00a859; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: bold; 
        }
        .footer { 
            text-align: center; 
            font-size: 11px; 
            color: #666; 
            padding-bottom: 10px; 
            background-color: #121212; 
        }
    </style>
</head>
<body>

    <div class="header">🤖 SERIK AI</div>
    <div class="settings-bar">
        <span>⚙️ Настройки</span> 
        <span>▼</span>
    </div>

    <div class="chat-container" id="chatbox">
        <div class="message bot-message">Привет! Я Serik AI Pro. Откройте ⚙️ Настройки, чтобы включить голос! ✨</div>
    </div>

    <div class="input-area">
        <button class="clear-btn" onclick="clearChat()">🗑️</button>
        <input type="text" id="userInput" class="input-box" placeholder="Введите ваш вопрос..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">Отправить</button>
    </div>
    <div class="footer">Serik ai это ИИ. ИИ может ошибаться.</div>

    <script>
        const chatbox = document.getElementById("chatbox");
        const userInput = document.getElementById("userInput");

        // Хабарламаны экранға шығару функциясы
        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(sender === "user" ? "user-message" : "bot-message");
            msgDiv.textContent = text;
            chatbox.appendChild(msgDiv);
            chatbox.scrollTop = chatbox.scrollHeight; // Төменге авто-скролл
        }

        // Backend-ке сұраныс жіберу функциясы
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Қолданушының жазғанын шығару
            appendMessage(text, "user");
            userInput.value = "";

            // 2. ИИ "ойланып жатыр" деген уақытша текст
            const loadingId = "loading-" + Date.now();
            const botDiv = document.createElement("div");
            botDiv.classList.add("message", "bot-message");
            botDiv.id = loadingId;
            botDiv.textContent = "Serik AI ойланып жатыр...";
            chatbox.appendChild(botDiv);
            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                // 3. Vercel Backend-іне (api/chat.py) жіберу
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                
                // 4. Жауапты экранға шығару (уақытша текстті өшіріп)
                document.getElementById(loadingId).remove();

                if (response.ok && data.response) {
                    appendMessage(data.response, "bot");
                } else {
                    appendMessage("Қате шықты: " + (data.error || "Белгісіз қате"), "bot");
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Сервермен байланыс жоқ. Қайтадан байқап көріңіз.", "bot");
            }
        }

        // Enter басылғанда хат жіберу
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        // Чатты тазарту функциясы
        function clearChat() {
            chatbox.innerHTML = '<div class="message bot-message">Привет! Я Serik AI Pro. Откройте ⚙️ Настройки, чтобы включить голос! ✨</div>';
        }
    </script>

</body>
</html>
