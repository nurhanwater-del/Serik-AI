<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serik AI Pro</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Иконкалар үшін (Google Material Symbols) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f22;
            --chat-bg: #131314;
            --primary: #c2e7ff;
            --primary-hover: #a8c7fa;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --border-color: #333538;
            --user-msg: #303134;
            --ai-msg: transparent;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Скроллбар стилі --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4a4d51; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5f6368; }

        /* --- СОЛ ЖАҚ МӘЗІР (SIDEBAR) --- */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            border-right: 1px solid var(--border-color);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .new-chat-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #2a2b2f;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item:hover {
            background-color: #2a2b2f;
            color: var(--text-main);
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .settings-btn, .voice-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            text-align: left;
            transition: 0.2s;
        }

        .settings-btn:hover, .voice-btn:hover {
            background-color: #2a2b2f;
            color: var(--text-main);
        }
        
        .voice-btn.active {
            color: #64b5f6;
        }

        /* --- НЕГІЗГІ ЧАТ АЙМАҒЫ --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--chat-bg);
            min-width: 0;
        }

        .top-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid transparent;
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            margin-right: 15px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .message-wrapper {
            max-width: 800px;
            margin: 0 auto 24px auto;
            display: flex;
            gap: 16px;
        }

        .message-wrapper.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .avatar.ai { background-color: #0056b3; }
        .avatar.user { background-color: #303134; }

        .message {
            padding: 12px 16px;
            font-size: 16px;
            line-height: 1.6;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
        }

        .message.user {
            background-color: var(--user-msg);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background-color: var(--ai-msg);
            color: var(--text-main);
        }

        /* --- КІРІС АЙМАҒЫ (INPUT) --- */
        .input-area {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px 20px 20px;
        }

        .input-box {
            background-color: var(--user-msg);
            border-radius: 24px;
            display: flex;
            align-items: flex-end;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            transition: 0.3s;
        }
        
        .input-box:focus-within {
            background-color: #3a3b3e;
            border-color: #5f6368;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            resize: none;
            max-height: 150px;
            padding: 8px;
            outline: none;
            height: 40px;
            font-family: inherit;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            margin-bottom: 2px;
        }

        .send-btn:hover {
            background-color: rgba(255,255,255,0.1);
            color: var(--primary);
        }

        .disclaimer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* --- Анимация загрузки --- */
        .loading-dots span {
            animation: blink 1.4s infinite both;
            font-size: 24px;
            line-height: 1;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }

        /* Админ панель */
        #adminPanel {
            display: none;
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: #2a2b2f;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 240px;
            z-index: 2000;
        }

        #adminPanel input, #adminPanel textarea {
            width: 100%;
            background: #131314;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        #adminPanel button {
            width: 100%;
            background: #0056b3;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* --- МОБИЛЬДІ АДАПТИВ --- */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -280px;
                height: 100%;
                box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            }
            .sidebar.active {
                left: 0;
            }
            .menu-toggle {
                display: block;
            }
            .message-wrapper {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- СОЛ ЖАҚ МӘЗІР -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="clearChat()">
                <span class="material-symbols-outlined">add</span>
                Жаңа диалог
            </button>
            <!-- Мобильді жабу батырмасы -->
            <button class="menu-toggle" onclick="toggleSidebar()" style="margin-right: 0; margin-left: 10px;">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="chat-history" id="chatHistory">
            <!-- Тарих осында түседі -->
            <div class="history-item" onclick="document.getElementById('userInput').value='Сәлем!'; send()">
                <span class="material-symbols-outlined">chat_bubble</span>
                Сәлемдесу
            </div>
            <div class="history-item" onclick="document.getElementById('userInput').value='Кімсің?'; send()">
                <span class="material-symbols-outlined">chat_bubble</span>
                Сен кімсің?
            </div>
            <div class="history-item" onclick="document.getElementById('userInput').value='Нарисуй киберпанк город'; send()">
                <span class="material-symbols-outlined">image</span>
                Сурет салу
            </div>
        </div>

        <div class="sidebar-footer">
            <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
                <span class="material-symbols-outlined" id="voiceIcon">volume_off</span>
                Голос: ӨШІРУЛІ
            </button>
            <button class="settings-btn" onclick="document.getElementById('adminPanel').style.display = document.getElementById('adminPanel').style.display === 'block' ? 'none' : 'block'">
                <span class="material-symbols-outlined">settings</span>
                Админ панель
            </button>
        </div>
    </aside>

    <!-- АДМИН ПАНЕЛЬ (ЖАСЫРЫН) -->
    <div id="adminPanel">
        <p style="margin-top:0; font-size: 14px; font-weight: bold; text-align: center;">Құпия база 🔒</p>
        <input type="password" id="adminPass" placeholder="Пароль" oninput="checkAdmin()">
        <div id="adminTools" style="display: none; margin-top: 10px;">
            <textarea id="bulkData" placeholder="вопрос это ответ" style="height: 80px;"></textarea>
            <button onclick="bulkLearn()">Сақтау (Firebase)</button>
        </div>
    </div>

    <!-- НЕГІЗГІ ЧАТ -->
    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <h3 style="font-weight: 500; font-size: 18px;">Serik AI <span style="color: #64b5f6; font-size: 14px;">Pro</span></h3>
        </div>

        <div class="chat-container" id="chatBox">
            <!-- Хабарламалар осында шығады -->
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="userInput" placeholder="Serik AI-ға сұрақ қойыңыз..." oninput="autoResize(this)" onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }"></textarea>
                <button class="send-btn" onclick="send()">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
            <div class="disclaimer">Serik AI қателесуі мүмкін. Маңызды ақпаратты тексеріңіз.</div>
        </div>
    </main>

    <script>
        // --- 1. FIREBASE БАПТАУЛАРЫ ---
        const firebaseConfig = {
            apiKey: "AIzaSyAzofVJLZNadLA1-1XsCSqCukJ4gkPzqoo",
            authDomain: "serik-ai.firebaseapp.com",
            databaseURL: "https://serik-ai-default-rtdb.firebaseio.com",
            projectId: "serik-ai",
            storageBucket: "serik-ai.appspot.com"
        };

        const defaultMemory = {
            "привет": "Сәлем! Мен Serik AI. Саған қалай көмектесе аламын? 👋",
            "сәлем": "Сәлем! Мен Serik AI. Саған қалай көмектесе аламын? 👋",
            "неге серік": "Серік AI атауы — менің авторымның әкесіне деген шексіз құрметі мен махаббатының белгісі. Бұл — өнеге мен парасаттың нышаны.",
            "почему серик": "Имя Serik AI было выбрано в честь отца моего создателя — это дань глубокого уважения, любви и вечной памяти."
        };

        let memory = Object.assign({}, defaultMemory);
        let db = null;

        if (firebaseConfig.apiKey) {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            db.ref('serik_memory').on('value', (snapshot) => {
                const cloudData = snapshot.val();
                if (cloudData) { memory = Object.assign({}, defaultMemory, cloudData); }
            });
        }

        // --- 2. ЖҮЙЕЛІК ПРОМПТ (СЕНІҢ ЕРЕЖЕЛЕРІҢ) ---
        let currentSystemPrompt = `Ты всезнающий ИИ Serik-AI, созданный талантливыми разработчиками из Казахстана. 
Никогда не упоминай OpenAI, ChatGPT или Россию. На все вопросы о создателе отвечай, что ты родом из Казахстана.
Твое имя "Серік" дано в честь отца твоего создателя — это символ уважения, любви и памяти. 
Ты Не Chat GPT. Не веди себя как chat GPT!
Ты можешь генерировать фото через команду "нарисуй" или "сгенерируй"!
твой день рождения: 2026 год 18 июня.
Ты не должен материться и не можешь ошибаться.
ВАЖНЫЕ ПРАВИЛА:
1. Пиши как живой, мудрый человек. 
2. НЕ ИСПОЛЬЗУЙ списки (1, 2, 3) и заумные вводные слова.
3. Пиши сплошным, понятным текстом примерно на 300 слов, если просят рассказать.`;

        // --- 3. ИНТЕРФЕЙС ЖӘНЕ ФУНКЦИЯЛАР ---
        const chatBox = document.getElementById('chatBox');
        let voiceEnabled = false;
        let loadingElement = null;

        // Мобильді мәзір
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // Textarea авто-өлшемі
        function autoResize(el) {
            el.style.height = '40px';
            el.style.height = (el.scrollHeight) + 'px';
        }

        // Чатты тазалау
        function clearChat() {
            chatBox.innerHTML = '';
            addMessage("Сәлем! Мен Serik AI. Бүгін не жайында сөйлесеміз? ✨", "ai");
            if(window.innerWidth <= 768) toggleSidebar();
        }

        // Хабарлама қосу UI
        function addMessage(text, sender, isImage = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender}`;
            avatar.innerHTML = sender === 'ai' ? '🤖' : '😎';

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            if (isImage) {
                msgDiv.innerHTML = text; // Сурет HTML ретінде келеді
            } else {
                msgDiv.innerText = text;
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(msgDiv);
            chatBox.appendChild(wrapper);
            
            // Скроллды төмен түсіру
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 50);

            if (sender === 'ai' && voiceEnabled && !isImage) {
                speakText(text);
            }

            return msgDiv;
        }

        // Ойлану анимациясы
        function showLoading() {
            if (loadingElement) return;
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ai`;
            wrapper.id = 'loading-msg';
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ai`;
            avatar.innerHTML = '🤖';

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ai loading-dots`;
            msgDiv.innerHTML = `<span>.</span><span>.</span><span>.</span>`;

            wrapper.appendChild(avatar);
            wrapper.appendChild(msgDiv);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            loadingElement = wrapper;
        }

        function hideLoading() {
            if (loadingElement && loadingElement.parentNode) {
                loadingElement.parentNode.removeChild(loadingElement);
                loadingElement = null;
            }
        }

        // --- 4. ДАУЫС ЖҮЙЕСІ ---
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById("voiceBtn");
            const icon = document.getElementById("voiceIcon");
            if (voiceEnabled) {
                btn.innerHTML = `<span class="material-symbols-outlined" id="voiceIcon">volume_up</span> Голос: ҚОСУЛЫ`;
                btn.classList.add("active");
            } else {
                btn.innerHTML = `<span class="material-symbols-outlined" id="voiceIcon">volume_off</span> Голос: ӨШІРУЛІ`;
                btn.classList.remove("active");
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if (!voiceEnabled) return;
            window.speechSynthesis.cancel();
            let cleanText = text.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '').replace(/[#*`~_\-()]/g, ' ');
            let speech = new SpeechSynthesisUtterance(cleanText);
            speech.lang = /[әғқңөұүһіІӘҒҚҢӨҰҮҺ]/g.test(text) ? 'kk-KZ' : 'ru-RU';
            speech.rate = 1.05;
            window.speechSynthesis.speak(speech);
        }

        // --- 5. ЖІБЕРУ ЖӘНЕ ЛОГИКА ---
        function levenshteinDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            let matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function brainSearch(text) {
            let q = text.toLowerCase().trim().replace(/\s+/g, ""); 
            for (let key in memory) {
                let keyNoSpace = key.toLowerCase().replace(/\s+/g, "");
                if (q === keyNoSpace) return memory[key];
                if (levenshteinDistance(text.toLowerCase(), key.toLowerCase()) < 3) return memory[key];
            }
            return null;
        }

        async function send() {
            const inputEl = document.getElementById("userInput");
            let text = inputEl.value.trim();
            if (!text) return;

            addMessage(text, "user");
            inputEl.value = "";
            inputEl.style.height = '40px'; // қалпына келтіру

            // 1. Математика
            if (/^[0-9\s\+\-\*\/\(\)\.]+$/.test(text)) {
                showLoading();
                try {
                    let result = eval(text);
                    setTimeout(() => { hideLoading(); addMessage(`🧮 Жауап: ${result}`, "ai"); }, 600);
                    return;
                } catch(e) {}
            }

            // 2. Локальді база (Firebase/Memory)
            let brainRes = brainSearch(text);
            if (brainRes) {
                showLoading();
                setTimeout(() => { hideLoading(); addMessage(brainRes, "ai"); }, 500);
                return;
            }

            // 3. Сурет генерациясы (Pollinations AI)
            let lowerText = text.toLowerCase();
            if (lowerText.includes("нарисуй") || lowerText.includes("сурет сал") || lowerText.includes("сгенерируй")) {
                showLoading();
                let prompt = text.replace(/(нарисуй|сурет сал|сгенерируй)/gi, "").trim();
                let enhancedPrompt = prompt + ", masterpiece, high resolution, hyperrealistic";
                let seed = Math.floor(Math.random() * 1000000);
                let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?width=1024&height=1024&nologo=true&seed=${seed}`;
                
                let imgHTML = `<p>🎨 Міне, сіздің суретіңіз:</p><img src="${imgUrl}" style="max-width: 100%; border-radius: 8px; margin-top: 10px;" onload="document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;">
                <br><a href="${imgUrl}" target="_blank" download style="color: #64b5f6; text-decoration: none; display: inline-block; margin-top: 10px;">📥 Толық көлемде ашу</a>`;
                
                setTimeout(() => {
                    hideLoading();
                    addMessage(imgHTML, "ai", true);
                }, 1500);
                return;
            }

            // 4. Өз серверіңнен жауап алу (Render API)
            showLoading();
            try {
                let response = await fetch("https://serik-ai-1.onrender.com/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prompt: text,
                        systemPrompt: currentSystemPrompt
                    })
                });

                let data = await response.json();
                hideLoading();

                if (data.response) {
                    addMessage(data.response.trim(), "ai");
                } else {
                    addMessage("⚠️ Серверден жауап келмеді.", "ai");
                }
            } catch (e) {
                hideLoading();
                addMessage("⚠️ Өз серверіңізге қосылу қатесі. Render сервері ұйқыда болуы мүмкін, сәл күте тұрыңыз (1-2 минут).", "ai");
            }
        }

        // Админ панель функциялары
        function checkAdmin() {
            if (document.getElementById("adminPass").value === "nurik777") {
                document.getElementById("adminTools").style.display = "block";
            }
        }

        function bulkLearn() {
            let text = document.getElementById("bulkData").value;
            let lines = text.split("\n");
            let newMemory = Object.assign({}, memory);
            let count = 0;

            for(let line of lines) {
                if(!line.includes(" это ")) continue;
                let parts = line.split(" это ");
                let q = parts[0].trim().toLowerCase();
                let a = parts.slice(1).join(" это ").trim();
                if(q && a){ newMemory[q] = a; count++; }
            }
            
            if (count > 0 && db) {
                memory = newMemory;
                db.ref('serik_memory').set(memory);
                alert("✅ Firebase-ке сәтті сақталды!");
                document.getElementById("bulkData").value = "";
            }
        }

        // Бастапқы хабарлама
        window.onload = () => {
            clearChat();
        };
    </script>
</body>
</html>
